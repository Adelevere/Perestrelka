<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perestrelka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
        <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
          <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </symbol>
      </svg>
    <div class="container visible" id="startGame">
        <h1>Игра Перестрелка</h1>
        <form onsubmit="return submitPlayerNumber();" id="startForm">
            <div class="row">
                <div class="col-8">
                    <label for="playerNumber" class="form-label">Количество игроков</label>
                    <input type="number" class="form-control" maxlength="2"  name="playerNumber" id="playerNumber" value="20">
                    <div class="form-text">Количество комманд не может быть меньше 2 и больше 50</div>
                    <div id="playerNumberFeedback" class="invalid-feedback">Количество команд неверное</div>
                </div>
            </div>
            <div class="row">
                <div class="col-8">
                    <button type="submit" class="btn btn-primary">Начать Игру!</button>
                </div>
            </div>
        </form>
    </div>
    <div class="container invisible" id="Game">
        <form onsubmit="return submitvalues();" id="page">
            <div class="row">
                <div class="col-8">
                    <label for="hunterSelector" class="form-label">Выберите команду, которая производит выстрел</label>
                    <select  class="form-select" aria-label="Default select example" id="selectHunter" onchange="Decision()">
                        <option value="" selected disabled hidden>Выберите команду</option>
                    </select>
                </div>
            </div>
            <div class="row invisible" id="exersises">
                <div class="col-8">
                        <div class="card">
                            <div class="card-body">
                                <div id="hunterAnswer"></div>
                                <button type="button" class="btn btn-success" onclick="rightAnswer()">Да</button>
                                <button type="button" class="btn btn-danger" onclick="wrongAnswer()">Нет</button>
                            </div>
                    </div>
                </div>
            </div>
            <div class="row invisible" id="rightAnswer">
                <div class="col-8">
                    <label class="form-label">Выберите жертву</label>
                    <select class="form-select" aria-label="Default select example" id="selectVictim" onchange="endOfPage()">
                        <option value="" selected disabled hidden>Выберите команду</option>
                    </select>
                </div>
            </div>
            <div class="row invisible" id="pageEnd">
                <div class="col-8">
                        <div class="card">
                            <div class="card-body">
                                <div id="hunterAnswer"></div>
                                <button type="button" class="btn btn-primary btn-lg" onclick="next()">Подтвердить</button>
                                <button type="button" class="btn btn-secondary btn-lg" onclick="cancelation()">Отменить</button>
                            </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="row" id="true">
        <div class="col-8">
            <div class="alert alert-primary invisible" role="alert" id="trueAlert"></div>
        </div>
    </div>
    <div class="row" id="false">
        <div class="col-8">
            <div class="alert alert-secondary invisible" role="alert" id="falseAlert"></div>
        </div>
    </div>
    <div class="alert alert-danger d-flex align-items-center invisible" role="alert" id="GameOver">
        <svg class="bi flex-shrink-0 me-2" role="img" aria-label="Danger:"><use xlink:href="#exclamation-triangle-fill"/></svg>
        <div>Игра окончена! Все игроки мертвы!</div>
    </div>
    <div class="row invisible" id="endOfGame">
        <div class="col-8">
                <div class="card">
                    <div class="card-body">
                        <button type="button" class="btn btn-dark" onclick="endOfGame()">Конец игры</button>
                        <button type="button" class="btn btn-light" onclick="table()">Открыть таблицу</button>
                    </div>
            </div>
        </div>
    </div>
    <div class="row invisible" id="theEnd">
        <div class="col-8">
            <div class="card">
                <div class="card-body">
                    <div>Игра окончена, результаты выведены на экран</div>
                </div>
            </div>
        </div>
    </div>
    <div class="row invisible" id="nextGame">
        <div class="col-8">
            <div class="card">
                <div class="card-body">
                    <button type="button" class="btn btn-primary" onclick="nextGame()">Начать следующую игру</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js" integrity="sha384-Rx+T1VzGupg4BHQYs2gCW9It+akI2MM/mndMCy36UVfodzcJcF0GGLxZIzObiEfa" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
